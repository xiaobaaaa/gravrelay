name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9 is not provided on Ubuntu 26.04.
          - os: ubuntu-22.04
            node: '22'
            python: '3.9'
          - os: ubuntu-latest
            node: '24'
            python: '3.12'
          - os: macos-latest
            node: '24'
            python: '3.12'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Check JavaScript syntax
        run: |
          for file in runtime/*.cjs runtime/*.js tests/*.cjs; do
            node --check "$file"
          done
      - name: Check Python syntax
        run: python -m compileall -q install.py runtime tools tests
      - name: Test JavaScript
        run: node --test tests/*.test.cjs
      - name: Test Python
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify release package
        run: python tools/build_release.py --output-dir dist
